[package]
name = "agent_bridge"
version = "0.3.0"
description = "agent-bridge 桌面应用核心：设备身份、配置与系统信息（开发中）"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
flutter_rust_bridge = "=2.11.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
is_elevated = "0.1.2"
libc = "0.2.189"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
subtle = "2.6.1"
sys-locale = "0.3.2"
sysinfo = "0.39.6"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "process", "fs", "io-util", "time", "macros", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml_edit = "0.25.15"
uuid = { version = "1.26.1", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile = "3.27.0"
